services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: podanauli-api:latest
    restart: unless-stopped
    environment:
      PODANAULI_CORS_ORIGINS: ${PODANAULI_CORS_ORIGINS:-http://localhost:8080}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: podanauli-frontend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PODANAULI_HTTP_PORT:-8080}:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/healthz
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
