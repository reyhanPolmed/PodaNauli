services:
  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: podanauli:latest
    restart: unless-stopped
    environment:
      PODANAULI_CORS_ORIGINS: ${PODANAULI_CORS_ORIGINS:-http://localhost:8080}
      PODANAULI_ADMIN_USERNAME: ${PODANAULI_ADMIN_USERNAME:-stakeholder}
      PODANAULI_ADMIN_PASSWORD: ${PODANAULI_ADMIN_PASSWORD:?PODANAULI_ADMIN_PASSWORD wajib diisi}
      PODANAULI_COOKIE_SECURE: ${PODANAULI_COOKIE_SECURE:-false}
      PODANAULI_SESSION_HOURS: ${PODANAULI_SESSION_HOURS:-8}
    ports:
      - "${PODANAULI_HTTP_PORT:-8080}:8000"
    volumes:
      - podanauli_runtime:/app/data/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  podanauli_runtime:
